# Confirme estes dois valores no SonarCloud depois de criar o projeto
# (Administration -> Update Key). O padrao do SonarCloud para um repo do GitHub
# e "<org>_<repo>" na chave e "<org>" na organizacao.
sonar.projectKey=mathewsjts_derivative-environments
sonar.organization=mathewsjts

sonar.projectName=derivative-environments
sonar.sources=src,api
sonar.tests=test
sonar.sourceEncoding=UTF-8

# dist/ e artefato de build; scripts de demo nao sao codigo de producao.
sonar.exclusions=dist/**,node_modules/**,coverage/**

# SEM COVERAGE, E O QUALITY GATE NAO PODE EXIGIR COVERAGE
#
# Nao geramos lcov: custaria um `npm ci` a mais no job do Sonar (que hoje so faz
# checkout e scan) e a POC tem orcamento de 2 minutos por PR.
#
# A consequencia demorou a aparecer, e vale escrever para nao voltar a doer. O
# "Sonar way" exige 80% de cobertura em CODIGO NOVO. Enquanto os PRs mexiam so
# em workflows, docs e declaracoes de tipo, nao havia linha executavel nova e a
# condicao nunca era avaliada -- o gate ficava verde por vacuo. O primeiro PR a
# adicionar codigo executavel em src/ (a resolucao gravada) tomou ERROR com
# new_coverage = 0%, e o codigo dele estava 100% coberto por teste. O gate
# estava medindo a ausencia de um RELATORIO, nao a ausencia de TESTE.
#
# Duas saidas: gerar o relatorio, ou nao exigir a metrica. Esta POC existe para
# demonstrar um modelo de branching, e o papel do Sonar aqui e provar que existe
# um portao de qualidade travando o merge -- nao replicar a politica de
# qualidade de um projeto real. Entao o projeto usa um quality gate proprio, sem
# a condicao de cobertura. Ver SETUP.md, secao 4.
#
# O que continua em pe nesse gate, e por isso ele nao virou adesivo:
#
#   new_reliability_rating          GT 1     bug novo reprova
#   new_security_rating             GT 1     vulnerabilidade nova reprova
#   new_maintainability_rating      GT 1     code smell novo reprova
#   new_duplicated_lines_density    GT 3     duplicacao nova reprova
#   new_security_hotspots_reviewed  LT 100   hotspot nao revisado reprova
#
# Para ligar coverage depois (e ai a condicao pode voltar):
#   npm i -D @vitest/coverage-v8
#   npm test -- --coverage
#   sonar.javascript.lcov.reportPaths=coverage/lcov.info
#   + npm ci e os testes no job SonarCloud do pr-gates.yml
#
# Medido em 05/09/2026, ja com os testes que existem hoje: manifest.ts 100%,
# version.ts 100%, projeto 91.8% -- so o server.ts (9 linhas de bootstrap, nunca
# importado por teste) fica em 0%. Ou seja, ligar nao exigiria escrever teste
# nenhum; exigiria pagar o `npm ci`.
