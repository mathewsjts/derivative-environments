# ---------------------------------------------------------------------------
# sync-prs.yml
#
# POR QUE EXISTE
#
# Quando a main anda, todo PR aberto fica desatualizado. Isso NAO impede a
# branch de entrar em dev/hom -- a montagem sempre parte de origin/main e faz
# merge da branch, entao uma branch atrasada entra normalmente enquanto nao
# conflitar.
#
# Este cabecalho ja listou tres motivos. Eles nao envelheceram igual, e vale
# corrigir o registro em vez de deixar o argumento mais forte do que a realidade:
#
#   1. "Com `strict` ligado, PR desatualizado nao mergeia."
#      O `strict` esta DESLIGADO, por decisao escrita (SETUP.md, secao 3b):
#      prevencao O(N x PRs abertos) trocada pela deteccao O(1) dos gates na
#      main. Este motivo deixou de existir.
#
#   2. "Os gates do PR rodam sobre uma main que nao existe mais."
#      Continua verdade e continua sendo beneficio real -- mas nao urgente. Os
#      gates re-rodam no proximo push da branch de qualquer jeito, e agora a
#      propria main tem CI (pr-gates em `push: [main]`) para pegar o que escapou
#      da janela.
#
#   3. "Quanto mais a branch atrasa, mais provavel ela conflitar."
#      ESTAVA FORTE DEMAIS. Este workflow faz `merge main -> branch`; o
#      assemble-env.sh faz `merge branch -> main`. Mesma base de merge, mesmos
#      dois commits: MESMO conflito. Atualizar a branch nao muda se ela conflita
#      hoje. Muda o TAMANHO do proximo merge -- e antecipa a hora em que a
#      pessoa descobre. E um beneficio menor, e de outra natureza.
#
# O QUE SOBRA -- E POR QUE ELE E DIARIO, E NAO REFLEXO DE PUSH
#
# Sobra "integre cedo, em pedacos pequenos". Beneficio real, incremental, e sem
# urgencia: nao precisa acontecer a cada merge na main.
#
# Rodando a cada push na main, um merge amplificava em ate N runs (N = PRs
# marcados): cada atualizacao e um push, cada push dispara os gates e uma
# reconstrucao de ambiente. Rodando uma vez por dia -- 06:00 UTC, o mesmo
# horario do label-ttl, antes de qualquer um comecar o dia -- a amplificacao cai
# de O(merges x PRs) para O(1/dia).
#
# Quem precisa da atualizacao AGORA tem dois botoes que nao esperam o
# agendamento: o "Update branch" do proprio PR, e este workflow em
# workflow_dispatch.
#
# O QUE ELE FAZ
#
# Uma vez por dia (ou sob demanda), atualiza com o "Update branch" nativo do
# GitHub (merge da main na branch) cada PR aberto QUE CARREGA ALGUMA LABEL
# deploy:*. Nao rebaseia e nao faz force-push: quem tiver a branch localmente
# continua conseguindo dar `git pull`.
#
# POR QUE SO OS MARCADOS (only_labeled, padrao true)
#
# Atualizar todo PR aberto amplifica um merge na main numa rajada de runs: cada
# atualizacao e um push, cada push dispara pr-gates e rebuild-env. Com 30 PRs
# abertos, um merge vira ~30 runs extras -- a amplificacao mais perigosa deste
# desenho em escala real, e ela cresce com o numero de PRs abertos, nao com o
# tamanho do time.
#
# E o que sobrou dos motivos so vale AGORA para quem esta dentro de um ambiente:
#
#   1. Gates rodando contra uma main que nao existe mais -- eles re-rodam no
#      proximo push da branch de qualquer jeito.
#   2. Merge menor da proxima vez -- so compensa para quem esta disputando
#      espaco num conjunto e quer descobrir cedo que precisa rebasear.
#
# Para quem nao esta em ambiente nenhum, estar atrasado e inofensivo: a montagem
# parte sempre da main (ver o primeiro paragrafo) e o merge do PR nao exige
# estar em dia (o `strict` esta desligado).
#
# O QUE ISSO CUSTA, DITO EXPLICITAMENTE
#
# Um PR sem label que ganhar uma label depois so sera atualizado no PROXIMO
# disparo -- ou seja, ate 24h depois, porque aplicar a label nao dispara este
# workflow. Ate la ele pode estar atrasado, e isso e inofensivo: a montagem
# parte sempre de origin/main e faz merge da branch, entao estar atras nao
# exclui ninguem do ambiente (ver o primeiro paragrafo). Quem quiser a
# atualizacao na hora tem dois botoes: o "Update branch" do proprio PR, ou este
# workflow no modo manual.
#
# Para atualizar TODO PR aberto (o comportamento antigo), rode manualmente com
# a caixa `only_labeled` desmarcada.
#
# O QUE ELE NAO FAZ
#
# Nao resolve conflito. Se o merge da main na branch conflitar, ele PULA e
# segue para o proximo PR -- mesma regra do rebuild-env. Resolucao de conflito
# contra a main e trabalho humano, feito uma vez, no PR.
#
# Nao comenta. Um PR que conflita com a main ja mostra isso de duas formas: o
# banner de out-of-date do GitHub e o aviso do passo "sincronia com a main", com
# a mensagem explicando o rebase. Comentar a cada execucao seria ruido -- e nao
# existe marca de estado aqui para deduplicar, como a blocked:<env> faz no
# rebuild-env.
# ---------------------------------------------------------------------------
name: sync-prs

on:
  # Diario, nao reflexo de push. Ver o cabecalho: o que sobrou deste workflow e
  # "integre cedo, em pedacos pequenos", que nao tem urgencia nenhuma.
  schedule:
    # 06:00 UTC (03:00 em Sao Paulo), o mesmo horario do label-ttl.yml -- antes
    # de qualquer um comecar o dia, e ja com a main de ontem inteira dentro.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "So listar quem seria atualizado"
        type: boolean
        default: false
      only_labeled:
        description: "Atualizar so PRs com alguma label deploy:* (ver o cabecalho)"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

# Serializado: duas execucoes atualizando os mesmos PRs se atropelariam no
# expected_head_sha. Aqui nao cancelamos a anterior -- ela pode estar no meio de
# uma atualizacao que vale terminar.
concurrency:
  group: sync-prs
  cancel-in-progress: false

jobs:
  sync:
    name: atualizar PRs abertos com a main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Exigir credenciais do GitHub App
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "Credenciais do App presentes."
            exit 0
          fi
          echo "::error title=GitHub App nao configurado::Ver SETUP.md, secao 1."
          {
            echo ""
            echo "Com o GITHUB_TOKEN padrao a atualizacao ate aconteceria, mas o"
            echo "push resultante nao dispararia workflow nenhum: os gates do PR"
            echo "nao re-rodariam e o ambiente nao seria reconstruido."
            echo ""
          } >&2
          exit 1

      - name: Token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Atualizar
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Em disparo agendado nao existe `inputs`, entao o fallback e o padrao
          # de verdade deste workflow. Desmarcar a caixa no disparo manual manda
          # a string 'false', que e truthy na expressao e vence o fallback --
          # continua dando para atualizar TODO PR aberto de proposito.
          ONLY_LABELED: ${{ github.event.inputs.only_labeled || 'true' }}
        run: |
          set -euo pipefail

          UPDATED=0
          CONFLICTED=0
          SKIPPED=0

          {
            echo "## 🔄 sync-prs"
            echo ""
            echo "Base: \`main\` @ \`${GITHUB_SHA:0:7}\`"
            if [ "$DRY_RUN" = "true" ]; then
              echo ""
              echo "> **dry-run**: nada foi atualizado."
            fi
            echo ""
            echo "| | PR | branch | atraso |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          prs="$(gh pr list --state open --base main --limit 100 \
                   --json number,headRefName,headRefOid,isDraft,labels \
                   --jq '.[] | [.number, .headRefName, .headRefOid, (.isDraft|tostring),
                                ([.labels[].name] | map(select(startswith("deploy:"))) | length | tostring)]
                              | @tsv')"

          if [ -z "$prs" ]; then
            echo "Nenhum PR aberto para a main."
            echo "| — | — | _nenhum PR aberto_ | — |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS=$'\t' read -r pr branch sha draft deploy_labels; do
            [ -n "${pr:-}" ] || continue

            if [ "$draft" = "true" ]; then
              echo "  pula   #${pr} ${branch} (draft)"
              SKIPPED=$((SKIPPED + 1))
              echo "| ⏸️ | #${pr} | \`${branch}\` | draft |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [ "$ONLY_LABELED" = "true" ] && [ "$deploy_labels" = "0" ]; then
              echo "  pula   #${pr} ${branch} (sem label deploy:*)"
              SKIPPED=$((SKIPPED + 1))
              echo "| ⏸️ | #${pr} | \`${branch}\` | sem label |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            behind="$(gh api "repos/${GH_REPO}/compare/main...${branch}" --jq '.behind_by')"

            if [ "$behind" -eq 0 ]; then
              echo "  em dia #${pr} ${branch}"
              echo "| ✅ | #${pr} | \`${branch}\` | em dia |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "  seria atualizado #${pr} ${branch} (${behind} atras)"
              echo "| 🔄 | #${pr} | \`${branch}\` | ${behind} atrás |" >> "$GITHUB_STEP_SUMMARY"
              UPDATED=$((UPDATED + 1))
              continue
            fi

            # expected_head_sha protege contra atropelar um push que aconteceu
            # entre a listagem e agora -- o equivalente do --force-with-lease.
            if gh api -X PUT "repos/${GH_REPO}/pulls/${pr}/update-branch" \
                 -f expected_head_sha="$sha" --silent 2>/tmp/sync-err-${pr}.txt; then
              echo "  ATUALIZA #${pr} ${branch} (${behind} atras)"
              UPDATED=$((UPDATED + 1))
              echo "| 🔄 | #${pr} | \`${branch}\` | ${behind} atrás → atualizado |" >> "$GITHUB_STEP_SUMMARY"
            else
              # Conflito com a main. Nao resolvemos: e trabalho humano, feito uma
              # vez, no PR. O loop segue -- um PR conflitante nao pode impedir os
              # outros de serem atualizados.
              echo "  CONFLITO #${pr} ${branch} -- deixado para o autor"
              cat "/tmp/sync-err-${pr}.txt" >&2 || true
              CONFLICTED=$((CONFLICTED + 1))
              echo "| ⛔ | #${pr} | \`${branch}\` | ${behind} atrás → conflito |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$prs"

          {
            echo ""
            echo "**${UPDATED} atualizado(s), ${CONFLICTED} em conflito, ${SKIPPED} pulado(s).**"
            if [ "$CONFLICTED" -gt 0 ]; then
              echo ""
              echo "> Os PRs em conflito precisam de rebase manual na \`main\` — uma vez,"
              echo "> contra código já revisado e mergeado. O job não resolve conflito."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "${UPDATED} atualizado(s), ${CONFLICTED} em conflito, ${SKIPPED} pulado(s)."
