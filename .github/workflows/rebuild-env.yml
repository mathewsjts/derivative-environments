# ---------------------------------------------------------------------------
# rebuild-env.yml -- o coracao da POC.
#
# POR QUE EXISTE
#
# No modelo antigo, `dev` e `hom` sao branches de longa duracao que recebem
# merge humano. Elas acumulam commits que nao existem em nenhum outro lugar,
# viram fonte de cherry-pick e transformam cada feature em ate 3 PRs.
#
# Aqui elas deixam de ser branches e viram ARTEFATOS DERIVADOS: a cada gatilho,
# o job joga fora o que estava la e remonta do zero a partir da main de agora,
# reaplicando os PRs abertos que carregam a label deploy:<env>.
#
#   dev = main + (todo PR aberto com deploy:dev que mergeia limpo)
#   hom = main + (todo PR aberto com deploy:hom que mergeia limpo)
#
# Consequencias que valem dizer em voz alta:
#   - Ninguem faz merge em dev/hom. Quem faz push e este job.
#   - Deploy continua sendo push na branch de ambiente. Muda quem empurra.
#   - Conflito nao trava o ambiente: a branch conflitante fica de fora, o resto
#     sobe, e o PR dela recebe um comentario. O loop nao para.
#   - Rodar duas vezes seguidas sem mudanca produz o mesmo SHA e nao publica
#     nada (ver o passe 2 em .github/scripts/assemble-env.sh).
# ---------------------------------------------------------------------------
name: rebuild-env

on:
  push:
    # dev e hom sao SAIDA deste job, nunca entrada -- ignorar as duas evita o
    # laco infinito. A main NAO esta na lista de proposito: mergear na main e
    # justamente o que precisa redisparar a reconstrucao dos dois ambientes.
    branches-ignore: [dev, hom]

  # pull_request_target, e nao pull_request. A diferenca nao e cosmetica:
  #
  #   pull_request        -> o GitHub executa a definicao do workflow que esta
  #                          no MERGE REF DO PR, ou seja, a copia que veio na
  #                          branch da feature.
  #   pull_request_target -> executa a definicao que esta na BRANCH BASE (main).
  #
  # Com `pull_request`, uma branch atrasada monta o ambiente com a logica de
  # derivacao dela, nao a da main. Ja quebrou: uma branch anterior a uma mudanca
  # de formato do manifesto rodou o script velho contra o codigo novo da main, e
  # o docker build reprovou o conjunto (corretamente, sem publicar).
  #
  # E o mesmo principio do passo "Carregar a logica de derivacao da main", uma
  # camada acima: o ambiente e derivado da main, entao TUDO que decide como ele
  # e montado -- workflow e scripts -- tem que vir da main.
  #
  # LIMITE DE CONFIANCA: pull_request_target roda com o contexto e os segredos
  # da branch base. Aqui isso e aceitavel porque a logica de derivacao nunca vem
  # do PR, e porque uma branch so entra no conjunto se alguem com permissao de
  # escrita aplicar a label deploy:<env> -- a label E o limite de confianca. Num
  # repositorio que aceita PR de fork, isso precisa ser uma decisao consciente:
  # o `docker build` roda sobre a arvore montada, que inclui o codigo do PR.
  #
  # Efeito colateral bom: estes jobs deixam de aparecer como check do PR. O PR
  # passa a mostrar so os gates, que e o que importa para quem revisa.
  pull_request_target:
    # labeled/unlabeled  -> entrou ou saiu de um conjunto
    # closed             -> saiu do conjunto (mergeado ou nao)
    # reopened           -> pode voltar ao conjunto
    types: [labeled, unlabeled, closed, reopened]

  # O gatilho mais usado ao vivo. Se algo travar durante a apresentacao, este e
  # o botao: Actions -> rebuild-env -> Run workflow.
  workflow_dispatch:
    inputs:
      environment:
        description: Qual ambiente reconstruir
        type: choice
        options: [ambos, dev, hom]
        default: ambos
      max_set:
        description: "Sobrescreve o teto do conjunto (vazio = padrao: dev 10, hom 5)"
        required: false
        default: ""

# O GITHUB_TOKEN so precisa ler. Escrita (push na branch de ambiente, comentario
# e label no PR) sai do token do GitHub App -- ver o passo "Token do GitHub App".
permissions:
  contents: read
  pull-requests: read

jobs:
  # -------------------------------------------------------------------------
  # QUEM PRECISA SER RECONSTRUIDO
  #
  # Este job existe separado, e SEM grupo de concorrencia, por um motivo que
  # custou caro: enquanto a decisao morava dentro do job de reconstrucao, um
  # evento irrelevante ainda assim reivindicava o grupo `rebuild-<env>` e o
  # `cancel-in-progress` matava o run que estava fazendo o trabalho de verdade.
  #
  # Aconteceu assim: merge na main -> rebuild-env comeca a reconstruir os dois
  # ambientes -> o sync-prs atualiza as branches dos PRs abertos -> cada push
  # dispara um rebuild-env novo -> esses runs cancelam o da main e SO ENTAO
  # descobrem que a branch deles nao esta em nenhum conjunto e encerram sem
  # fazer nada. Resultado: dev e hom parados numa base antiga, com todos os
  # workflows verdes.
  #
  # Com a decisao aqui fora, so quem vai realmente reconstruir entra na fila --
  # e ai o cancel-in-progress volta a ser seguro, porque toda reconstrucao
  # parte da main de agora e a mais nova de fato torna a anterior irrelevante.
  #
  # A matriz do job seguinte sai daqui. Lista vazia = nenhum job, e nao um job
  # que nasce so para desistir.
  # -------------------------------------------------------------------------
  guard:
    name: quais ambientes este evento afeta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      any: ${{ steps.decide.outputs.any }}

    steps:
      - name: Decidir
        id: decide
        env:
          # Leitura apenas: o GITHUB_TOKEN padrao basta e evita cunhar um token
          # de App so para responder uma pergunta.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SELECTED: ${{ github.event.inputs.environment || 'ambos' }}
          MAX_OVERRIDE: ${{ github.event.inputs.max_set || '' }}
        run: |
          set -euo pipefail

          include='[]'

          for entry in "dev:10:VERCEL_URL_DEV" "hom:5:VERCEL_URL_HOM"; do
            env_name="${entry%%:*}"
            rest="${entry#*:}"
            max="${rest%%:*}"
            url_key="${rest#*:}"
            if [ -n "$MAX_OVERRIDE" ]; then max="$MAX_OVERRIDE"; fi

            reason=""
            wanted=false

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
               && [ "$SELECTED" != "ambos" ] && [ "$SELECTED" != "$env_name" ]; then
              reason="disparo manual pediu '$SELECTED'"
            elif [ "${{ github.event_name }}" != "push" ]; then
              wanted=true
              reason="evento ${{ github.event_name }}: pode ter mudado o conjunto"
            elif [ "${{ github.ref_name }}" = "main" ]; then
              wanted=true
              reason="push na main: a base mudou"
            else
              n=$(gh pr list --state open --base main --head "${{ github.ref_name }}" \
                    --label "deploy:$env_name" --json number --jq 'length')
              if [ "$n" -gt 0 ]; then
                wanted=true
                reason="a branch esta no conjunto"
              else
                reason="a branch nao esta no conjunto"
              fi
            fi

            if [ "$wanted" = true ]; then
              echo "  $env_name: RECONSTRUIR ($reason)"
              include="$(jq -c --arg e "$env_name" --argjson m "$max" --arg u "$url_key" \
                '. + [{env:$e, max:$m, urlKey:$u}]' <<<"$include")"
            else
              echo "  $env_name: pular ($reason)"
            fi
          done

          any=$([ "$(jq 'length' <<<"$include")" -gt 0 ] && echo true || echo false)
          echo "matrix=$(jq -c -n --argjson i "$include" '{include:$i}')" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

          {
            echo "### Ambientes a reconstruir"
            echo ""
            if [ "$any" = true ]; then
              jq -r '.[] | "- `\(.env)` (teto \(.max))"' <<<"$include"
            else
              echo "Nenhum. Este evento nao afeta nenhum ambiente."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    name: reconstruir ${{ matrix.env }}
    needs: guard
    if: needs.guard.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Um ambiente com problema nao pode impedir o outro de ser publicado --
      # e a mesma regra que aplicamos as branches dentro de um conjunto.
      fail-fast: false
      # Matriz dinamica: so os ambientes que o guard aprovou.
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}

    # Por ambiente, nao global: reconstruir dev nao tem por que esperar hom.
    # cancel-in-progress e seguro AQUI porque so entram runs que vao reconstruir
    # de fato, e toda reconstrucao parte da main de agora.
    concurrency:
      group: rebuild-${{ matrix.env }}
      cancel-in-progress: true

    env:
      ENV_NAME: ${{ matrix.env }}
      MAX_SET: ${{ matrix.max }}
      STATE_FILE: ${{ github.workspace }}/../rebuild-state-${{ matrix.env }}.json
      ENV_URL: ${{ vars[matrix.urlKey] }}

    steps:
      # ---------------------------------------------------------------------
      # Por que nao o GITHUB_TOKEN padrao?
      #
      # Push feito com o GITHUB_TOKEN NAO dispara workflows (protecao do GitHub
      # contra recursao). Como o deploy neste modelo e disparado por push na
      # branch de ambiente, usar o GITHUB_TOKEN faria o push funcionar e o
      # deploy simplesmente nao acontecer -- sem erro, sem log, sem aviso.
      # A falha e silenciosa, que e a pior especie.
      #
      # O workflow fake-deploy.yml existe para provar isso ao vivo.
      # ---------------------------------------------------------------------
      - name: Exigir credenciais do GitHub App
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "Credenciais do App presentes."
            exit 0
          fi
          echo "::error title=GitHub App nao configurado::APP_ID e/ou APP_PRIVATE_KEY ausentes."
          {
            echo ""
            echo "Este job nao pode cair para o GITHUB_TOKEN padrao."
            echo ""
            echo "Push feito com GITHUB_TOKEN nao dispara workflows. O push"
            echo "aconteceria, a branch de ambiente atualizaria, e o deploy"
            echo "nunca rodaria -- sem nenhuma mensagem de erro."
            echo ""
            echo "Configure conforme SETUP.md, secao 1."
            echo ""
          } >&2
          exit 1

      - name: Token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historico completo: a montagem faz merge de N branches.
          fetch-depth: 0
          # Credencial do App tambem no git, para que o push la embaixo saia
          # como o App e dispare os workflows de deploy.
          token: ${{ steps.app-token.outputs.token }}

      # ---------------------------------------------------------------------
      # A logica de derivacao vem SEMPRE da main, nunca do ref que disparou.
      #
      # Em evento `pull_request` o actions/checkout traz o merge ref do PR --
      # ou seja, a copia que esta na branch da feature. Usa-la para montar o
      # ambiente esta errado por dois motivos:
      #
      #   1. Principio: o ambiente e derivado da main. A logica de derivacao
      #      tambem tem que ser a da main, senao "derivado da main" e so meia
      #      verdade.
      #   2. Pratica: uma branch atrasada carrega a versao velha do script.
      #      Ja aconteceu -- o script antigo escreveu um manifesto no formato
      #      antigo por cima do codigo novo da main, e o `docker build` reprovou
      #      o conjunto (corretamente, sem publicar).
      #
      # Efeito colateral bom: um PR nao consegue mudar como os ambientes sao
      # montados. Para mudar a derivacao, e preciso passar pela main.
      # ---------------------------------------------------------------------
      - name: Carregar a logica de derivacao da main
        id: derive
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          dir="$RUNNER_TEMP/derive"
          mkdir -p "$dir"
          for script in assemble-env.sh notify.sh; do
            git show "origin/main:.github/scripts/$script" > "$dir/$script"
            chmod +x "$dir/$script"
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Derivando com os scripts de origin/main ($(git rev-parse --short origin/main))."
          echo "Ref que disparou: ${{ github.ref_name }} @ ${{ github.sha }}"

      # ---------------------------------------------------------------------
      # A montagem. O script nao publica nada -- da para roda-lo no laptop para
      # ensaiar (ver DEMO.md, "se der errado ao vivo").
      # ---------------------------------------------------------------------
      - name: Montar o conjunto de ${{ matrix.env }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: ${{ steps.derive.outputs.dir }}/assemble-env.sh

      - name: Resumo da montagem
        id: state
        run: |
          set -euo pipefail
          echo "noop=$(jq -r '.noop' "$STATE_FILE")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r '.envHead' "$STATE_FILE")" >> "$GITHUB_OUTPUT"
          echo "lease=$(jq -r '.remoteHead // ""' "$STATE_FILE")" >> "$GITHUB_OUTPUT"

          {
            echo "## \`${ENV_NAME}\` = $(jq -r '[.base.branch] + [.features[].branch] | join(" + ")' "$STATE_FILE")"
            echo ""
            echo "| | PR | branch | autor |"
            echo "|---|---|---|---|"
            jq -r '.features[] | "| ✅ | #\(.pr) | `\(.branch)` | @\(.author) |"' "$STATE_FILE"
            jq -r '.excluded[] | "| ⛔ | #\(.pr) | `\(.branch)` | @\(.author) |"' "$STATE_FILE"
            echo ""
            echo "- base \`main\` = \`$(jq -r '.base.sha' "$STATE_FILE")\`"
            echo "- HEAD de \`${ENV_NAME}\` = \`$(jq -r '.envHead' "$STATE_FILE")\`"
            echo "- no-op (conjunto identico ao que ja esta publicado): \`$(jq -r '.noop' "$STATE_FILE")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Gate antes de publicar. Se o CONJUNTO montado nao builda, o ambiente
      # anterior continua no ar -- publicar um conjunto quebrado seria pior do
      # que ficar um ciclo desatualizado.
      # ---------------------------------------------------------------------
      - name: docker build do conjunto montado
        if: steps.state.outputs.noop != 'true'
        run: |
          start=$(date +%s)
          docker build --no-cache -t "derivative-environments:${ENV_NAME}" .
          echo "docker build levou $(( $(date +%s) - start ))s"

      # ---------------------------------------------------------------------
      # Publicacao.
      #
      # --force-with-lease com o SHA esperado explicito: se alguem (ou outra
      # execucao) mexeu na branch depois da nossa leitura, o push falha em vez
      # de sobrescrever. --force puro nunca.
      #
      # E o push que dispara o deploy -- feito pelo App, portanto dispara
      # tambem os workflows (fake-deploy.yml).
      # ---------------------------------------------------------------------
      - name: Publicar ${{ matrix.env }}
        if: steps.state.outputs.noop != 'true'
        run: |
          set -euo pipefail
          lease="${{ steps.state.outputs.lease }}"
          if [ -z "$lease" ]; then
            echo "Branch $ENV_NAME ainda nao existe no remoto: push simples."
            git push origin "HEAD:refs/heads/$ENV_NAME"
          else
            git push --force-with-lease="refs/heads/$ENV_NAME:$lease" \
                     origin "HEAD:refs/heads/$ENV_NAME"
          fi

      - name: Nada mudou
        if: steps.state.outputs.noop == 'true'
        run: |
          echo "O conjunto montado tem o mesmo SHA que ja esta publicado em $ENV_NAME."
          echo "Sem docker build, sem push, sem redeploy. Idempotencia de verdade,"
          echo "nao 'resultado parecido'."

      # ---------------------------------------------------------------------
      # Notificacao SEMPRE que o job rodou -- inclusive no no-op.
      #
      # Nao e detalhe: um PR pode entrar em conflito sem que o conjunto
      # publicado mude (o ambiente ja tinha exatamente as mesmas features). O
      # ambiente e no-op, mas o autor do PR precisa do comentario.
      # ---------------------------------------------------------------------
      - name: Notificar os PRs afetados
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: ${{ steps.derive.outputs.dir }}/notify.sh
